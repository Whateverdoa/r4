[project]
name = "modal-vdp"
version = "0.1.0"
description = "Massive parallel VDP generation platform using Modal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.65.0",
    "python-barcode>=0.15.0",
    "qrcode[pil]>=7.4.0",
    "PyMuPDF>=1.24.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
